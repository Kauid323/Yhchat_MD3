name: Android Debug CI

on:
  workflow_dispatch:
  push:
    branches:
      - canary
      - main
      - experimental

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: standard
            gradle_task: assembleStandardDebug
            artifact_name: apk-standard-debug
            asset_name: app-standard-debug.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      # 方案 B：不写 gradle-version，直接跟随 gradle/wrapper/gradle-wrapper.properties
      # 里的 9.4.1。写死 9.2.1 会让 setup-gradle 下 9.2.1-bin，随后 ./gradlew 又下
      # 9.4.1-all，同一个发行包下两遍，且 9.2.1 那次 504 就直接把 job 干掉。
      #
      # continue-on-error：这一步只负责预热缓存 + 提供 gradle 可执行文件，
      # 功能上跟 ./gradlew 完全独立（gradlew 自己会按 wrapper 取发行包）。
      # 它失败不该让 build 失败，网络抖动交给下面的 warmup 步骤重试。
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        continue-on-error: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认值为 "tools platform-tools"，但旧版 "tools" 包已从 SDK 仓库下架，
          # sdkmanager 会报 "Failed to find package 'tools'" 并以 exit code 1 失败。
          # 只安装仍然可用的 platform-tools（build-tools / platforms 由 AGP 自动下载）。
          packages: 'platform-tools'

      - name: Enable 8G swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== Active swap ==="
          swapon --show
          echo "=== Memory ==="
          free -h

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 把「下发行包」从 build 步里剥离出来单独重试。
      #
      # 之前 gradlew 的发行包下载混在 Build 步里：services.gradle.org 一旦
      # Read timed out，整个 job 直接结束，连重试的机会都没有。
      # 现在先 ./gradlew --version 把发行包拉下来（这一步不编译任何东西），
      # 失败就切镜像再试，最多 3 轮；三轮都挂才算真的没网。
      #
      # 镜像脚本本身只探官方源：官方可达就完全不动 wrapper，
      # 保证网络正常时行为与以前一致。
      - name: Warm up Gradle distribution (retry with mirror)
        shell: bash
        run: |
          set -uo pipefail

          WRAPPER="gradle/wrapper/gradle-wrapper.properties"

          for attempt in 1 2 3; do
            echo "=========== attempt ${attempt}/3 ==========="
            if ./gradlew --version --no-daemon; then
              echo "Gradle distribution ready"
              exit 0
            fi
            echo "attempt ${attempt} failed, trying to switch mirror..."
            bash .github/scripts/setup-gradle-mirror.sh "$WRAPPER" || true
            sleep $((attempt * 10))
          done

          echo "Gradle distribution still unavailable after 3 attempts" >&2
          echo "--- current wrapper ---" >&2
          cat "$WRAPPER" >&2
          exit 1

      - name: Get commit hash
        id: commit
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.flavor }} debug APK
        run: ./gradlew ${{ matrix.gradle_task }} -PciVersionNameSuffix=${{ steps.commit.outputs.hash }}

      - name: Collect ${{ matrix.flavor }} APK
        run: |
          mkdir -p dist
          APK_PATH=$(find "app/build/outputs/apk/${{ matrix.flavor }}/debug" -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found for ${{ matrix.flavor }}" >&2
            exit 1
          fi
          cp "$APK_PATH" "dist/${{ matrix.asset_name }}"
          ls -lh dist

      - name: Upload ${{ matrix.flavor }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 30
