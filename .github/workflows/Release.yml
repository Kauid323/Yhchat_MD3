name: Release release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '自定义发布 tag（留空则默认使用 build-<commit_hash>）'
        required: false
        default: ''
      last_tag:
        description: '更新日志起始 tag/ref（可选，例如 v0.0.21-5）'
        required: false
        default: ''
      latest_tag:
        description: '更新日志结束 tag/ref（可选，例如 experimental）'
        required: false
        default: 'experimental'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: standard
            gradle_task: assembleStandardRelease
            artifact_name: apk-standard
            asset_name: app-standard-release.apk
          - flavor: miuix
            gradle_task: assembleMiuixRelease
            artifact_name: apk-miuix
            asset_name: app-miuix-release.apk
          - flavor: player
            gradle_task: assemblePlayerRelease
            artifact_name: apk-player
            asset_name: app-player-release.apk
          - flavor: playermiuix
            gradle_task: assemblePlayermiuixRelease
            artifact_name: apk-playermiuix
            asset_name: app-playermiuix-release.apk
          - flavor: live
            gradle_task: assembleLiveRelease
            artifact_name: apk-live
            asset_name: app-live-release.apk
          - flavor: livemiuix
            gradle_task: assembleLivemiuixRelease
            artifact_name: apk-livemiuix
            asset_name: app-livemiuix-release.apk
          - flavor: full
            gradle_task: assembleFullRelease
            artifact_name: apk-full
            asset_name: app-full-release.apk
          - flavor: fullmiuix
            gradle_task: assembleFullmiuixRelease
            artifact_name: apk-fullmiuix
            asset_name: app-fullmiuix-release.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '9.2.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认值为 "tools platform-tools"，但旧版 "tools" 包已从 SDK 仓库下架，
          # sdkmanager 会报 "Failed to find package 'tools'" 并以 exit code 1 失败。
          # 只安装仍然可用的 platform-tools（build-tools / platforms 由 AGP 自动下载）。
          packages: 'platform-tools'

      - name: Enable 8G swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== Active swap ==="
          swapon --show
          echo "=== Memory ==="
          free -h

      # services.gradle.org 在大陆网络下经常 504 或 read timeout，
      # 而 gradlew 首次启动就要下发行包（9.4.1-all 约 250MB），一卡整条流水线就挂。
      # 这个脚本先探官方源：能通就什么都不改（网络正常时行为跟以前完全一致），
      # 通了才留下原样；不通才按 腾讯云 → 阿里云 顺序切镜像。
      - name: Use Gradle mirror if official source is unreachable
        run: bash .github/scripts/setup-gradle-mirror.sh gradle/wrapper/gradle-wrapper.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$ENCODED_KEYSTORE" | base64 --decode > canary.jks
          echo "CANARY_STORE_FILE=$(pwd)/canary.jks" >> $GITHUB_ENV
          echo "CANARY_STORE_PASSWORD=${{ secrets.CANARY_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "CANARY_KEY_ALIAS=${{ secrets.CANARY_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "CANARY_KEY_PASSWORD=${{ secrets.CANARY_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Get commit hash
        id: commit
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.flavor }} release APK
        run: ./gradlew ${{ matrix.gradle_task }} -PciVersionNameSuffix=${{ steps.commit.outputs.hash }}

      - name: Collect ${{ matrix.flavor }} APK
        run: |
          mkdir -p dist
          APK_PATH=$(find "app/build/outputs/apk/${{ matrix.flavor }}/release" -maxdepth 1 -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found for ${{ matrix.flavor }}" >&2
            exit 1
          fi
          cp "$APK_PATH" "dist/${{ matrix.asset_name }}"
          ls -lh dist

      - name: Upload ${{ matrix.flavor }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.asset_name }}
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: release-assets

      - name: List APK files
        run: |
          echo "=== APK files ==="
          find release-assets -name "*.apk" -type f -exec ls -lh {} \;

      - name: Get commit hash
        id: commit
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "full_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Read version name from Gradle
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*val baseVersionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            echo "Failed to read baseVersionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "release_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Prepare release metadata
        id: release_meta
        run: |
          set -uo pipefail

          COMMIT_MESSAGE="$(git log -1 --pretty=%s 2>/dev/null || true)"
          HEAD_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          LAST_TAG_INPUT="${{ github.event.inputs.last_tag }}"
          LATEST_TAG_INPUT="${{ github.event.inputs.latest_tag }}"
          VAR_TAG="${{ vars.RELEASE_TAG }}"

          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          elif [ -n "$VAR_TAG" ]; then
            TAG_NAME="$VAR_TAG"
          else
            TAG_NAME="build-${{ steps.commit.outputs.hash }}"
          fi
          STANDARD_APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-standard-release.apk"
          MIUIX_APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-miuix-release.apk"
          PLAYER_APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-player-release.apk"
          PLAYER_MIUIX_APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-playermiuix-release.apk"
          LIVE_APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-live-release.apk"
          LIVE_MIUIX_APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-livemiuix-release.apk"
          FULL_APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-full-release.apk"
          FULL_MIUIX_APK_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/app-fullmiuix-release.apk"
          BEFORE_SHA="${{ github.event.before }}"
          EMPTY_BEFORE="0000000000000000000000000000000000000000"
          FULL_CHANGELOG_LINE=""

          # 取 commit 列表的优先级：
          #   1) 手动填了 last_tag/latest_tag → 用它俩之间的范围
          #   2) push 触发且有可达的 before → 用它到 HEAD
          #   3) 都不可用 → 最近 20 条
          # 每一步都加 || true：GitHub run 默认 -e，旧写法里 git log 报错会直接掐死 step，
          # 后面的 release body 和机器人通知全都出不来。
          COMMIT_RANGE=""
          if [ -n "$LAST_TAG_INPUT" ] && [ -n "$LATEST_TAG_INPUT" ]; then
            if git rev-parse --verify --quiet "${LAST_TAG_INPUT}^{commit}" >/dev/null 2>&1 \
               && git rev-parse --verify --quiet "${LATEST_TAG_INPUT}^{commit}" >/dev/null 2>&1; then
              COMMIT_RANGE="${LAST_TAG_INPUT}..${LATEST_TAG_INPUT}"
            else
              echo "WARN: tag range ${LAST_TAG_INPUT}..${LATEST_TAG_INPUT} not resolvable, falling back" >&2
            fi
            FULL_CHANGELOG_LINE="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG_INPUT}...${LATEST_TAG_INPUT}"
          fi

          if [ -z "$COMMIT_RANGE" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$EMPTY_BEFORE" ]; then
            if git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              COMMIT_RANGE="${BEFORE_SHA}..HEAD"
            fi
          fi

          if [ -n "$COMMIT_RANGE" ]; then
            COMMIT_LIST="$(git log --no-merges --format='- `%h` %s (%an)' "${COMMIT_RANGE}" 2>/dev/null || true)"
            CHANGELOG="$(git log --no-merges --format='- %s' "${COMMIT_RANGE}" 2>/dev/null || true)"
          fi

          if [ -z "${COMMIT_LIST:-}" ]; then
            COMMIT_LIST="$(git log --no-merges -n 20 --format='- `%h` %s (%an)' 2>/dev/null || true)"
            CHANGELOG="$(git log --no-merges -n 20 --format='- %s' 2>/dev/null || true)"
          fi

          # 兜底：连 git log 都取不到时，至少给一条当前提交
          if [ -z "${COMMIT_LIST:-}" ] && [ -n "$HEAD_SHA" ]; then
            COMMIT_LIST="- \`${HEAD_SHA:0:7}\` ${COMMIT_MESSAGE}"
          fi
          if [ -z "${CHANGELOG:-}" ]; then
            CHANGELOG="- ${COMMIT_MESSAGE}"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "commit range: ${COMMIT_RANGE:-<none, fell back to recent commits>}"

          {
            printf '## Build Information\n'
            printf -- '- **Version**: %s\n' "${{ steps.version.outputs.release_name }}"
            printf -- '- **Commit Hash**: %s\n' "${{ steps.commit.outputs.full_hash }}"
            printf -- '- **Build Date**: %s\n' "${{ steps.date.outputs.date }}"
            printf -- '- **Branch**: %s\n' "${{ github.ref_name }}"
            printf '\n'
            printf '## Build Variants\n'
            printf -- '- **Standard**: [app-standard-release.apk](%s)\n' "${STANDARD_APK_URL}"
            printf -- '- **Miuix**: [app-miuix-release.apk](%s)\n' "${MIUIX_APK_URL}"
            printf -- '- **Player**: [app-player-release.apk](%s)\n' "${PLAYER_APK_URL}"
            printf -- '- **PlayerMiuix**: [app-playermiuix-release.apk](%s)\n' "${PLAYER_MIUIX_APK_URL}"
            printf -- '- **Live**: [app-live-release.apk](%s)\n' "${LIVE_APK_URL}"
            printf -- '- **LiveMiuix**: [app-livemiuix-release.apk](%s)\n' "${LIVE_MIUIX_APK_URL}"
            printf -- '- **Full**: [app-full-release.apk](%s)\n' "${FULL_APK_URL}"
            printf -- '- **FullMiuix**: [app-fullmiuix-release.apk](%s)\n' "${FULL_MIUIX_APK_URL}"
            printf '\n'
            printf '## Changelog\n'
            printf '%s\n' "${CHANGELOG}"
            printf '\n'
            printf '## Commit List\n'
            printf '%s\n' "${COMMIT_LIST}"
            printf '\n'
            printf '%s\n' "${FULL_CHANGELOG_LINE}"
          } > release-body.md

          # 云湖通知只展示最近 5 条 commit
          BOT_COMMIT_LIST="$(printf '%s\n' "${COMMIT_LIST}" | head -n 5)"

          {
            printf '## Build Information\n'
            printf -- '- **Version**: %s\n' "${{ steps.version.outputs.release_name }}"
            printf -- '- **Commit Hash**: %s\n' "${{ steps.commit.outputs.full_hash }}"
            printf -- '- **Build Date**: %s\n' "${{ steps.date.outputs.date }}"
            printf -- '- **Branch**: %s\n' "${{ github.ref_name }}"
            printf '\n'
            printf '## Build Variants\n'
            printf -- '- **StandardRelease**: [app-standard-release.apk](%s)\n' "${STANDARD_APK_URL}"
            printf -- '- **MiuixRelease**: [app-miuix-release.apk](%s)\n' "${MIUIX_APK_URL}"
            printf -- '- **PlayerRelease**: [app-player-release.apk](%s)\n' "${PLAYER_APK_URL}"
            printf -- '- **PlayermiuixRelease**: [app-playermiuix-release.apk](%s)\n' "${PLAYER_MIUIX_APK_URL}"
            printf '\n'
            printf '## Changelog\n'
            printf '%s\n' "${CHANGELOG}"
            printf '\n'
            printf '## Commit List\n'
            printf '%s\n' "${BOT_COMMIT_LIST}"
            printf '\n'
            printf '%s\n' "${FULL_CHANGELOG_LINE}"
          } > bot-release-body.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          name: Canary ${{ steps.version.outputs.release_name }}
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          body_path: release-body.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify bot about release
        continue-on-error: true
        env:
          BOT_SEND_TOKEN_VAR: ${{ vars.YHCHAT_BOT_SEND_TOKEN }}
          BOT_SEND_TOKEN_SECRET: ${{ secrets.YHCHAT_BOT_SEND_TOKEN }}
          BOT_RECV_ID_VAR: ${{ vars.YHCHAT_BOT_RECV_ID }}
          BOT_RECV_ID_SECRET: ${{ secrets.YHCHAT_BOT_RECV_ID }}
          BOT_RECV_TYPE_VAR: ${{ vars.YHCHAT_BOT_RECV_TYPE }}
          BOT_RECV_TYPE_SECRET: ${{ secrets.YHCHAT_BOT_RECV_TYPE }}
        run: |
          BOT_SEND_TOKEN="${BOT_SEND_TOKEN_VAR:-$BOT_SEND_TOKEN_SECRET}"
          BOT_RECV_ID="${BOT_RECV_ID_VAR:-$BOT_RECV_ID_SECRET}"
          BOT_RECV_TYPE="${BOT_RECV_TYPE_VAR:-$BOT_RECV_TYPE_SECRET}"

          if [ -z "$BOT_SEND_TOKEN" ] || [ -z "$BOT_RECV_ID" ] || [ -z "$BOT_RECV_TYPE" ]; then
            echo "Skip bot notify"
            echo "YHCHAT_BOT_SEND_TOKEN: $([ -n "$BOT_SEND_TOKEN" ] && echo present || echo missing)"
            echo "YHCHAT_BOT_RECV_ID: $([ -n "$BOT_RECV_ID" ] && echo present || echo missing)"
            echo "YHCHAT_BOT_RECV_TYPE: $([ -n "$BOT_RECV_TYPE" ] && echo present || echo missing)"
            exit 0
          fi

          RELEASE_BODY="$(cat bot-release-body.md)"

          send_markdown() {
            local text="$1"
            local payload
            payload=$(jq -n \
              --arg recvId "$BOT_RECV_ID" \
              --arg recvType "$BOT_RECV_TYPE" \
              --arg text "$text" \
              '{
                recvId: $recvId,
                recvType: $recvType,
                contentType: "markdown",
                content: {
                  text: $text
                }
              }')

            curl --fail-with-body \
              -X POST "https://chat-go.jwzhd.com/open-apis/v1/bot/send?token=${BOT_SEND_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload"
          }

          send_file() {
            local file_path="$1"
            local file_name
            local upload_response
            local file_key
            local payload

            file_name=$(basename "$file_path")
            upload_response=$(curl --fail-with-body -sS \
              -X POST "https://chat-go.jwzhd.com/open-apis/v1/file/upload?token=${BOT_SEND_TOKEN}" \
              -F "file=@${file_path};filename=${file_name}") || return 1

            file_key=$(printf '%s' "$upload_response" | jq -r '.data.fileKey // empty')
            if [ -z "$file_key" ]; then
              echo "Upload did not return fileKey for ${file_name}"
              return 1
            fi

            payload=$(jq -n \
              --arg recvId "$BOT_RECV_ID" \
              --arg recvType "$BOT_RECV_TYPE" \
              --arg fileKey "$file_key" \
              '{
                recvId: $recvId,
                recvType: $recvType,
                contentType: "file",
                content: {
                  fileKey: $fileKey
                }
              }')

            curl --fail-with-body \
              -X POST "https://chat-go.jwzhd.com/open-apis/v1/bot/send?token=${BOT_SEND_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload"
          }

          if ! send_markdown "$RELEASE_BODY"; then
            echo "Markdown bot notification failed"
            exit 0
          fi

          BOT_APKS=(
            "release-assets/app-standard-release.apk"
            "release-assets/app-miuix-release.apk"
            "release-assets/app-player-release.apk"
            "release-assets/app-playermiuix-release.apk"
          )

          for apk in "${BOT_APKS[@]}"
          do
            [ -f "$apk" ] || continue

            apk_size=$(stat -c%s "$apk")
            if [ "$apk_size" -ge 20971520 ]; then
              echo "Skip bot file send for $(basename "$apk"): size ${apk_size} bytes >= 20MB"
              continue
            fi

            if ! send_file "$apk"; then
              echo "Bot file send failed for $(basename "$apk"), continue"
            fi
          done

          SUMMARY_PAYLOAD=$(jq -n \
            --arg recvId "$BOT_RECV_ID" \
            --arg recvType "$BOT_RECV_TYPE" \
            --arg text "Release bot notification finished. StandardRelease, MiuixRelease, PlayerRelease, and PlayermiuixRelease were sent when upload succeeded; files >= 20MB were skipped." \
            '{
              recvId: $recvId,
              recvType: $recvType,
              contentType: "markdown",
              content: {
                text: $text
              }
            }')

          curl --fail-with-body \
            -X POST "https://chat-go.jwzhd.com/open-apis/v1/bot/send?token=${BOT_SEND_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$SUMMARY_PAYLOAD" || true

  notify-failure:
    # build 是 matrix job：部分 flavor 失败时它整体是 failure，但 cancelled 以及
    # 被跳过的 job 不应该触发通知，所以排除 cancelled。
    if: ${{ always() && (needs.build.result == 'failure' || needs.release.result == 'failure') && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    needs: [build, release]
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 失败通知要读 git log 拼 header，浅克隆会让 subject/sha 取不到
          fetch-depth: 0

      - name: Ensure gh and jq available
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh not found, installing..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq gh
          fi
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found, installing..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          gh --version
          jq --version

      - name: Notify bot about failure
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_LABEL: Release
          BOT_SEND_TOKEN_VAR: ${{ vars.YHCHAT_BOT_SEND_TOKEN }}
          BOT_SEND_TOKEN_SECRET: ${{ secrets.YHCHAT_BOT_SEND_TOKEN }}
          BOT_RECV_ID_VAR: ${{ vars.YHCHAT_BOT_RECV_ID }}
          BOT_RECV_ID_SECRET: ${{ secrets.YHCHAT_BOT_RECV_ID }}
          BOT_RECV_TYPE_VAR: ${{ vars.YHCHAT_BOT_RECV_TYPE }}
          BOT_RECV_TYPE_SECRET: ${{ secrets.YHCHAT_BOT_RECV_TYPE }}
        run: |
          # 显式用 bash 调脚本；文件权限在 Windows 检出后可能丢失可执行位，这里补一下
          chmod +x .github/scripts/bot-notify-failure.sh
          bash .github/scripts/bot-notify-failure.sh
